// ── SUPABASE API ──────────────────────────────────────────────────────────
async function sbFetch(path, method="GET", body=null, extraHeaders={}){
  const headers = {
    "apikey": SB_KEY,
    "Authorization": "Bearer " + SB_KEY,
    "Content-Type": "application/json",
    ...extraHeaders
  };
  const opts = { method, headers };
  if(body !== null) opts.body = JSON.stringify(body);
  const res = await fetch(SB_URL + path, opts);
  if(!res.ok){
    const err = await res.text();
    console.error("Supabase error:", res.status, err);
    throw new Error("(" + res.status + ") " + err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function calcProgress(t){
  const all=CF.flatMap(s=>s.items);
  const done=all.filter(i=>(t.progress.competencies[i.id]?.signoffs?.length||0)>=2).length;
  return{total:all.length,done,pct:Math.round((done/all.length)*100)};
}
function daysActive(t){return Math.max(0,Math.floor((Date.now()-new Date(t.startDate))/86400000));}
function daysLeft(t){return Math.max(0,140-daysActive(t));}
function fmtDate(d){if(!d)return"";return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
function accentColor(t){
  if(t.graduated)return"#16a34a";
  const d=daysActive(t);
  if(d>120)return"#dc2626";
  if(d>98)return"#ea580c";
  return"#9333ea";
}
function getPace(t){
  const days=daysActive(t),{done}=calcProgress(t);
  const total=CF.flatMap(s=>s.items).length;
  let m=PACE[PACE.length-1];
  for(const p of PACE){if(days<=p.days){m=p;break;}}
  const target=m.target>=9999?total:m.target;
  return{onTrack:done>=target,done,target,label:m.label,pct:Math.min(100,Math.round((done/target)*100))};
}

// ── DOM BUILDER ───────────────────────────────────────────────────────────
function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(e.style,v);}
    else if(k.startsWith("on")&&typeof v==="function"){e.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className"){e.className=v;}
    else if(k==="value"&&(tag==="input"||tag==="textarea")){e.value=v||"";}
    else if(k==="disabled"){if(v)e.disabled=true;}
    else if(k==="placeholder"){e.placeholder=v;}
    else if(k==="type"){e.type=v;}
    else if(k==="rows"){e.rows=v;}
    else if(k==="title"){e.title=v;}
    else if(k==="accept"){e.accept=v;}
    else{try{e[k]=v;}catch(_){e.setAttribute(k,v);}}
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false||c===undefined)return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return e;
}
function ring(pct,size,stroke,color){
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("width",size);svg.setAttribute("height",size);
  svg.style.transform="rotate(-90deg)";svg.style.flexShrink="0";
  const r=(size-stroke*2)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const bg=document.createElementNS(ns,"circle");
  bg.setAttribute("cx",cx);bg.setAttribute("cy",cy);bg.setAttribute("r",r);
  bg.setAttribute("fill","none");bg.setAttribute("stroke","#e9d5ff");bg.setAttribute("stroke-width",stroke);
  const fg=document.createElementNS(ns,"circle");
  fg.setAttribute("cx",cx);fg.setAttribute("cy",cy);fg.setAttribute("r",r);
  fg.setAttribute("fill","none");fg.setAttribute("stroke",color);fg.setAttribute("stroke-width",stroke);
  fg.setAttribute("stroke-dasharray",circ);fg.setAttribute("stroke-dashoffset",circ-(pct/100)*circ);
  fg.setAttribute("stroke-linecap","round");fg.style.transition="stroke-dashoffset .6s ease";
  svg.appendChild(bg);svg.appendChild(fg);
  return svg;
}

  try {
    showToast("Connecting to database...", true);
    const rows = await getAllTrainees();
    S.trainees = rows.map(rowToTrainee);
    hideToast();
    setState({view:"dashboard"});
  } catch(e) {
    hideToast();
    console.error("loadAll error:", e);
    // Table not created yet — show setup screen
    if(e.message.includes("relation") || e.message.includes("does not exist") ||
       e.message.includes("42P01") || e.message.includes("404") || e.message.includes("406")){
      setState({view:"setup"});
    } else {
      // Show error but still allow use (will retry on next action)
      setState({view:"error", errorMsg: e.message});
    }
  }
}

async function saveTrainee(t){
  showToast("Saving...", true);
  try {
    await upsertTrainee(t);
    // Update local state
    const idx = S.trainees.findIndex(x=>x.id===t.id);
    if(idx>=0) S.trainees[idx]=t; else S.trainees.push(t);
    showToast("✓ Saved");
    render();
  } catch(e){
    console.error("saveTrainee failed:", e);
    // If it's a table-not-found error, show setup screen
    if(e.message.includes("relation") || e.message.includes("does not exist") ||
       e.message.includes("42P01") || e.message.includes("404")){
      setState({view:"setup"});
    } else {
      showToast("⚠ Save failed: " + e.message);
    }
  }
}

async function removeTrainee(id){
  if(!confirm("Delete this trainee? This cannot be undone."))return;
  showToast("Deleting...", true);
  try {
    await deleteTrainee(id);
    S.trainees = S.trainees.filter(t=>t.id!==id);
    hideToast();
    setState({view:"dashboard"});
  } catch(e){ showToast("⚠ Delete failed: "+e.message); }
}

async function refreshAll(){
  showToast("Refreshing...", true);
  try {
    const rows = await getAllTrainees();
    S.trainees = rows.map(rowToTrainee);
    hideToast();
    render();
  } catch(e){ showToast("⚠ Refresh failed"); }
}

// PACE BAR
function renderPaceBar(t){
  const days=daysActive(t),{done}=calcProgress(t);
  const total=CF.flatMap(s=>s.items).length;
  const{onTrack,target,label,pct:pp}=getPace(t);
  const track=el("div",{style:{position:"relative",height:"38px",marginBottom:"6px"}});
  track.appendChild(el("div",{style:{position:"absolute",top:"15px",left:0,right:0,height:"8px",background:"#e9d5ff",borderRadius:"4px"}}));
  track.appendChild(el("div",{style:{position:"absolute",top:"15px",left:0,width:Math.min(100,(days/140)*100)+"%",height:"8px",background:"linear-gradient(90deg,#9333ea,#c084fc)",borderRadius:"4px",transition:"width .6s"}}));
  PACE.forEach((m,i)=>{
    const xp=(m.days/140)*100,tgt=m.target>=9999?total:m.target;
    const reached=done>=tgt,isCur=days<=m.days&&(i===0||days>PACE[i-1].days);
    const dot=el("div",{style:{position:"absolute",left:xp+"%",top:0,transform:"translateX(-50%)",textAlign:"center"}},
      el("div",{style:{width:isCur?"18px":"12px",height:isCur?"18px":"12px",borderRadius:"50%",margin:"0 auto",background:reached?"#9333ea":isCur?"#c084fc":"#ddd6fe",border:isCur?"2px solid #7e22ce":"2px solid #c4b5fd",marginTop:isCur?"5px":"8px",boxShadow:isCur?"0 0 0 3px #ede9fe":"none"}}),
      el("div",{style:{fontSize:"9px",color:isCur?"#7e22ce":"#9ca3af",fontWeight:isCur?"700":"400",marginTop:"2px",whiteSpace:"nowrap"}},tgt>=total?"All":""+tgt)
    );
    track.appendChild(dot);
  });
  if(days<=140) track.appendChild(el("div",{style:{position:"absolute",left:Math.min(100,(days/140)*100)+"%",top:0,transform:"translateX(-50%)",width:"2px",height:"38px",background:"#9333ea"}}));
  const labels=el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"10px"}});
  PACE.forEach((m,i)=>{const isCur=days<=m.days&&(i===0||days>PACE[i-1].days);labels.appendChild(el("div",{style:{fontSize:"9px",color:isCur?"#7e22ce":"#9ca3af",fontWeight:isCur?"700":"400"}},m.label));});
  return el("div",{style:{background:"#faf8ff",border:"1px solid #e9d5ff",borderRadius:"10px",padding:"14px 18px",marginBottom:"20px"}},
    el("div",{style:{fontSize:"12px",fontWeight:"700",color:"#6b21a8",marginBottom:"10px",textTransform:"uppercase",letterSpacing:".5px"}},"Pace Progress"),
    track,labels,
    el("div",{style:{display:"flex",gap:"14px",alignItems:"center",flexWrap:"wrap"}},
      el("div",{style:{flex:"1",background:onTrack?"#f0fdf4":"#fff7ed",border:"1px solid "+(onTrack?"#bbf7d0":"#fed7aa"),borderRadius:"8px",padding:"8px 14px"}},
        el("span",{style:{fontSize:"12px",color:onTrack?"#166534":"#9a3412",fontWeight:"700"}},onTrack?"✓ On Track":"⚠ Behind Target"),
        el("span",{style:{fontSize:"12px",color:"#666",marginLeft:"10px"}},done+"/"+target+" needed by "+label+" — "+pp+"% of pace target")
      ),
      el("div",{style:{fontSize:"12px",color:"#9333ea",fontWeight:"600"}},"Day "+days+" / 140")
    )
  );
}

function renderCompTable(t,persist){
  const wrap=el("div",null);
  CF.forEach(section=>{
    const sdone=section.items.filter(i=>(t.progress.competencies[i.id]?.signoffs?.length||0)>=2).length;
    const secHead=el("div",{style:{background:"linear-gradient(90deg,#7e22ce,#a855f7)",padding:"9px 14px",borderRadius:"6px 6px 0 0",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      el("span",{style:{fontSize:"12px",fontWeight:"700",color:"#fff",letterSpacing:"1px",textTransform:"uppercase"}},section.section),
      el("span",{style:{fontSize:"11px",color:"#e9d5ff"}},sdone+"/"+section.items.length)
    );
    const tbl=el("div",{style:{border:"1px solid #e9d5ff",borderTop:"none",borderRadius:"0 0 8px 8px",overflow:"hidden"}});
    const hdrRow=el("div",{className:"comp-hdr"});
    ["Competency",...MANAGERS.map(m=>m.split(" ").slice(0,2).join(" ")),"Date","💬"].forEach(h=>{
      hdrRow.appendChild(el("div",{style:{padding:"8px 10px",fontSize:"10px",color:"#c7d2fe",fontWeight:"700",textTransform:"uppercase",letterSpacing:".5px"}},h));
    });
    tbl.appendChild(hdrRow);

    section.items.forEach((item,idx)=>{
      const comp=t.progress.competencies[item.id];
      const complete=(comp?.signoffs?.length||0)>=2;
      const hasNote=(comp?.note||"").trim().length>0;
      const isExp=S.expandedNote===item.id;
      const rowBg=complete?"#f0fdf4":idx%2===0?"#fff":"#faf5ff";
      const row=el("div",{className:"comp-row",style:{background:rowBg}});

      const labelCell=el("div",{style:{padding:"9px 12px",fontSize:"12px",color:complete?"#166534":"#374151",display:"flex",alignItems:"center",gap:"5px"}});
      if(item.sub)labelCell.appendChild(el("span",{style:{color:"#d1d5db",fontSize:"11px",flexShrink:"0"}},"└"));
      labelCell.appendChild(document.createTextNode(item.label));
      if(complete)labelCell.appendChild(el("span",{style:{color:"#16a34a",flexShrink:"0"}}," ✓"));
      row.appendChild(labelCell);

      MANAGERS.forEach(mgr=>{
        const checked=(comp?.signoffs||[]).includes(mgr);
        const cell=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",borderLeft:"1px solid #f3e8ff"}});
        const cb=el("button",{className:"chk"+(checked?" on":""),onClick:async()=>{
          const u=JSON.parse(JSON.stringify(t));
          const c=u.progress.competencies[item.id];
          const i2=c.signoffs.indexOf(mgr);
          if(i2>=0){c.signoffs.splice(i2,1);if(c.signoffs.length<2)c.date=null;}
          else{c.signoffs.push(mgr);if(c.signoffs.length>=2&&!c.date)c.date=new Date().toISOString().split("T")[0];}
          await persist(u);
        }},checked?"✓":"");
        cell.appendChild(cb);row.appendChild(cell);
      });

      row.appendChild(el("div",{style:{padding:"9px 8px",fontSize:"11px",color:"#9ca3af",borderLeft:"1px solid #f3e8ff",display:"flex",alignItems:"center"}},comp?.date?fmtDate(comp.date):""));

      const noteCell=el("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",borderLeft:"1px solid #f3e8ff"}});
      noteCell.appendChild(el("button",{className:"note-btn"+(hasNote?" has":""),title:isExp?"Close":"Add note",
        onClick:()=>setState({expandedNote:isExp?null:item.id})},isExp?"▲":"✏"));
      row.appendChild(noteCell);
      tbl.appendChild(row);

      if(isExp){
        const noteArea=el("div",{className:"note-row"});
        const ta=el("textarea",{rows:"2",placeholder:"Add a coaching note or progress comment...",
          style:{...INP,resize:"vertical",fontSize:"12px",minHeight:"54px",color:"#374151",background:"#fff"}});
        ta.value=comp?.note||"";
        let noteTimer=null;
        ta.addEventListener("input",e=>{
          clearTimeout(noteTimer);
          noteTimer=setTimeout(async()=>{
            const u=JSON.parse(JSON.stringify(t));
            u.progress.competencies[item.id].note=e.target.value;
            await persist(u);
          },800);
        });
        noteArea.appendChild(ta);
        tbl.appendChild(noteArea);
        setTimeout(()=>ta.focus(),50);
      }
    });
    wrap.appendChild(el("div",{style:{marginBottom:"28px"}},secHead,tbl));
  });
  return wrap;
}

function renderExtra(t,persist){
  const done=EC.filter(e=>t.progress.extras[e.id]?.achieved).length;
  const grid=el("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:"10px"}});
  EC.forEach(ec=>{
    const v=t.progress.extras[ec.id];
    const card=el("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 14px",background:v.achieved?"#fffbeb":"#fff",border:"1px solid "+(v.achieved?"#fbbf24":"#e5e7eb"),borderRadius:"8px",cursor:"pointer",transition:"all .15s"}},
      el("div",{style:{width:"22px",height:"22px",borderRadius:"5px",border:"2px solid "+(v.achieved?"#f59e0b":"#d1d5db"),background:v.achieved?"#f59e0b":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:"0",color:"#fff",fontSize:"13px",fontWeight:"800"}},v.achieved?"✓":""),
      el("div",null,
        el("div",{style:{fontSize:"13px",color:v.achieved?"#92400e":"#374151",fontWeight:v.achieved?"600":"400"}},ec.label),
        v.date?el("div",{style:{fontSize:"11px",color:"#9ca3af",marginTop:"1px"}},fmtDate(v.date)):null
      )
    );
    card.addEventListener("click",async()=>{
      const u=JSON.parse(JSON.stringify(t));
      const vv=u.progress.extras[ec.id];
      if(vv.achieved){vv.achieved=false;vv.date=null;}else{vv.achieved=true;vv.date=new Date().toISOString().split("T")[0];}
      await persist(u);
    });
    card.addEventListener("mouseenter",()=>card.style.borderColor="#fbbf24");
    card.addEventListener("mouseleave",()=>card.style.borderColor=v.achieved?"#fbbf24":"#e5e7eb");
    grid.appendChild(card);
  });
  return el("div",null,
    el("div",{style:{background:"linear-gradient(90deg,#b45309,#d97706)",padding:"10px 14px",borderRadius:"8px",marginBottom:"18px",display:"flex",justifyContent:"space-between"}},
      el("span",{style:{fontSize:"12px",fontWeight:"700",color:"#fff",textTransform:"uppercase",letterSpacing:"1px"}},"⭐ Extra Credit — Accelerate Your Graduation"),
      el("span",{style:{fontSize:"12px",color:"#fde68a"}},done+"/"+EC.length+" achieved")
    ),grid
  );
}

function renderNotes(t,persist){
  const ta=el("textarea",{rows:"10",placeholder:"Add coaching notes, concerns, observations, milestones...",
    style:{...INP,height:"220px",resize:"vertical",lineHeight:"1.7",color:"#374151"}});
  ta.value=t.notes||"";
  let saveBtn;
  return el("div",{style:{maxWidth:"680px"}},
    el("label",{style:{display:"block",fontSize:"12px",color:"#6b7280",marginBottom:"8px",fontWeight:"600"}},"Manager Notes for "+t.name),
    ta,
    saveBtn=el("button",{style:{...B("#9333ea","#fff"),marginTop:"12px"},onClick:async()=>{
      const u=JSON.parse(JSON.stringify(t));
      u.notes=ta.value;
      await persist(u);
    }},"Save Notes")
  );
}

// REPORTS
function renderReports(){
  const ts=S.trainees;
  return el("div",{style:{minHeight:"100vh",background:"#f5f3ff"}},
    el("div",{style:{background:"linear-gradient(135deg,#581c87,#7e22ce)",padding:"24px 28px"}},
      el("button",{style:{background:"none",border:"none",color:"#c4b5fd",cursor:"pointer",fontSize:"13px",marginBottom:"14px",padding:"0",display:"block"},
        onClick:()=>setState({view:"dashboard"})},"← Back"),
      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"12px"}},
        el("div",null,
          el("h2",{style:{fontSize:"22px",fontWeight:"800",color:"#fff"}},"All Reports"),
          el("div",{style:{fontSize:"13px",color:"#c4b5fd",marginTop:"3px"}},ts.length+" trainees")
        )
      )
    ),
    el("div",{style:{padding:"24px 28px"}},
      ts.length===0
        ? el("div",{style:{textAlign:"center",color:"#9ca3af",padding:"60px"}},"No trainees yet.")
        : el("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}},
            ...ts.map(t=>{
              const{pct,done,total}=calcProgress(t);
              const pace=getPace(t);
              const color=accentColor(t);
              return el("div",{style:{background:"#fff",border:"1px solid #e9d5ff",borderRadius:"10px",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"12px",boxShadow:"0 1px 4px rgba(0,0,0,.04)"}},
                el("div",null,
                  el("div",{style:{fontSize:"15px",fontWeight:"700",color:"#1f2937"}},t.name),
                  el("div",{style:{fontSize:"12px",color:"#9ca3af",marginTop:"2px"}},"Started "+fmtDate(t.startDate)+" · Day "+daysActive(t)+(t.managerName?" · Mgr: "+t.managerName:"")),
                  el("div",{style:{marginTop:"6px",display:"flex",gap:"8px",flexWrap:"wrap"}},
                    el("span",{className:"badge",style:{color,background:color+"15"}},done+"/"+total+" ("+pct+"%)"),
                    el("span",{className:"badge",style:{color:pace.onTrack?"#166534":"#9a3412",background:pace.onTrack?"#f0fdf4":"#fff7ed"}},pace.onTrack?"✓ On pace":"⚠ Behind"),
                    t.graduated?el("span",{className:"badge",style:{color:"#166534",background:"#f0fdf4"}},"🎓 Graduated"):null
                  )
                ),
                el("button",{style:B("#9333ea","#fff"),onClick:()=>printReport(t)},"🖨 Print / Save PDF")
              );
            })
          )
    )
  );
}

// MAIN RENDER
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  let v;
  if(S.view==="loading")   v=renderLoading();
  else if(S.view==="error")   v=renderError();
  else if(S.view==="setup") v=renderSetup();
  else if(S.view==="dashboard") v=renderDashboard();
  else if(S.view==="new")   v=renderNew();
  else if(S.view==="detail") v=renderDetail();
  else if(S.view==="reports") v=renderReports();
  if(v) app.appendChild(v);
}

// BOOT
render();
loadAll();
</script>
</body>
</html>
